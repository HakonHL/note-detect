# Allow floating point in printf
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_I2S=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y
CONFIG_CMSIS_DSP_TRANSFORM=y
